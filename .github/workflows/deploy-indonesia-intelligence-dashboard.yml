name: Deploy Indonesia Intelligence Dashboard

permissions:
  contents: read

concurrency:
  group: indonesia-intelligence-dashboard-production
  cancel-in-progress: true

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "apps/indonesia-intelligence-dashboard/**"
      - ".github/workflows/deploy-indonesia-intelligence-dashboard.yml"

jobs:
  validate-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: indonesia-intelligence-dashboard-production
      url: https://indonesia-intelligence-dashboard.pages.dev
    defaults:
      run:
        working-directory: apps/indonesia-intelligence-dashboard
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/indonesia-intelligence-dashboard/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Validate dashboard data contract
        run: npm run validate:data

      - name: Build dashboard
        run: npm run build

      - name: Archive validated production artifact
        uses: actions/upload-artifact@v7
        with:
          name: indonesia-intelligence-dashboard-${{ github.sha }}
          path: apps/indonesia-intelligence-dashboard/dist
          if-no-files-found: error
          retention-days: 14

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -uo pipefail
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ] || [ -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]; then
            echo "::error::Cloudflare deployment secrets are missing"
            exit 1
          fi

          # Do not use /user/tokens/verify as a deployment gate. Some valid
          # account-scoped Pages tokens fail that endpoint even though Wrangler
          # can deploy successfully. The actual Pages operation below is the
          # authoritative permission check and retains bounded retries.

          # Project creation is idempotent. A pre-existing project is expected and harmless.
          npx --yes wrangler@4.114.0 pages project create indonesia-intelligence-dashboard \
            --production-branch=main >/tmp/wrangler-project.log 2>&1 || true

          # Bounded self-healing: retry transient Cloudflare/npm failures, then try the
          # current Wrangler release in case the pinned CLI has regressed.
          versions=("4.114.0" "4.114.0" "latest")
          delays=(0 15 45)
          for index in 0 1 2; do
            sleep "${delays[$index]}"
            version="${versions[$index]}"
            echo "Cloudflare Pages deploy attempt $((index + 1))/3 with wrangler@${version}"
            set +e
            npx --yes "wrangler@${version}" pages deploy dist \
              --project-name=indonesia-intelligence-dashboard \
              --branch=main \
              --commit-hash="${GITHUB_SHA}" \
              --commit-dirty=true 2>&1 | tee "/tmp/wrangler-deploy-$((index + 1)).log"
            status=${PIPESTATUS[0]}
            set -e
            if [ "$status" -eq 0 ]; then
              echo "Cloudflare Pages deployment succeeded on attempt $((index + 1))"
              exit 0
            fi
          done

          if grep -Eqi 'authentication|unauthorized|invalid.*token|code[": ]+10000|permission' /tmp/wrangler-deploy-*.log; then
            echo "::error::Cloudflare rejected the repository credential after three attempts; rotate CLOUDFLARE_API_TOKEN with Pages Edit permission"
          else
            echo "::error::Cloudflare Pages deployment failed after three bounded attempts"
          fi
          exit 1

      - name: Verify live deployment freshness
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          expected="$(node -p "require('./public/data/news.json').generatedAt")"
          expected_count="$(node -p "require('./public/data/news.json').items.length")"
          for attempt in $(seq 1 18); do
            if curl --fail --silent --show-error --location \
              --retry 2 --retry-all-errors \
              --user-agent 'Mozilla/5.0 GitHub-Actions-CI-CD-Verification' \
              "https://indonesia-intelligence-dashboard.pages.dev/data/news.json?sha=${EXPECTED_SHA}&attempt=${attempt}" \
              --output /tmp/live-news.json; then
              live="$(node -p "require('/tmp/live-news.json').generatedAt || ''" 2>/dev/null || true)"
              live_count="$(node -p "require('/tmp/live-news.json').items?.length || 0" 2>/dev/null || true)"
              if [ "$live" = "$expected" ] && [ "$live_count" = "$expected_count" ]; then
                echo "Live deployment verified: $live, $live_count items"
                exit 0
              fi
              echo "Attempt $attempt: live=$live/$live_count expected=$expected/$expected_count"
            fi
            sleep 10
          done
          echo "Cloudflare Pages remained stale after deployment verification window" >&2
          exit 1
