name: Deploy Indonesia Intelligence Dashboard

permissions:
  contents: read

concurrency:
  group: indonesia-intelligence-dashboard-production
  cancel-in-progress: true

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "apps/indonesia-intelligence-dashboard/**"
      - ".github/workflows/deploy-indonesia-intelligence-dashboard.yml"

jobs:
  validate-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: indonesia-intelligence-dashboard-production
      url: https://indonesia-intelligence-dashboard.pages.dev
    defaults:
      run:
        working-directory: apps/indonesia-intelligence-dashboard
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/indonesia-intelligence-dashboard/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Validate dashboard data contract
        run: npm run validate:data

      - name: Build dashboard
        run: npm run build

      - name: Archive validated production artifact
        uses: actions/upload-artifact@v4
        with:
          name: indonesia-intelligence-dashboard-${{ github.sha }}
          path: apps/indonesia-intelligence-dashboard/dist
          if-no-files-found: error
          retention-days: 14

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.94.0"
          workingDirectory: apps/indonesia-intelligence-dashboard
          preCommands: wrangler pages project create indonesia-intelligence-dashboard --production-branch=main || true
          command: pages deploy dist --project-name=indonesia-intelligence-dashboard --branch main --commit-dirty=true

      - name: Verify live deployment freshness
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          node <<'NODE'
          const local = require('./public/data/news.json');
          const url = 'https://indonesia-intelligence-dashboard.pages.dev/data/news.json';
          for (let attempt = 1; attempt <= 12; attempt++) {
            const response = await fetch(`${url}?sha=${process.env.EXPECTED_SHA}&attempt=${attempt}`, {
              headers: { 'user-agent': 'Mozilla/5.0 GitHub-Actions-CI-CD-Verification' }
            });
            if (response.ok) {
              const live = await response.json();
              if (live.generatedAt === local.generatedAt && live.items?.length === local.items?.length) {
                console.log(`Live deployment verified: ${live.generatedAt}, ${live.items.length} items`);
                process.exit(0);
              }
              console.log(`Attempt ${attempt}: live=${live.generatedAt}, expected=${local.generatedAt}`);
            } else {
              console.log(`Attempt ${attempt}: HTTP ${response.status}`);
            }
            await new Promise(resolve => setTimeout(resolve, 10000));
          }
          throw new Error('Cloudflare Pages remained stale after deployment verification window');
          NODE
