name: Deploy Cloudflare Worker

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
  workflow_dispatch:

jobs:
  deploy-worker:
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main') }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker/contact-form
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 2

      - name: Detect Worker changes
        id: changes
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "worker=true" >> "$GITHUB_OUTPUT"
            echo "Manual run requested; Worker deployment is enabled."
            exit 0
          fi

          target_sha="${{ github.event.workflow_run.head_sha }}"
          if git diff --name-only "${target_sha}^" "$target_sha" | grep -q '^worker/contact-form/'; then
            echo "worker=true" >> "$GITHUB_OUTPUT"
            echo "Worker files changed; deployment is enabled."
          else
            echo "worker=false" >> "$GITHUB_OUTPUT"
            echo "Worker files did not change; preserving the healthy live Worker without redeploying it."
          fi

      - name: Setup Node
        if: steps.changes.outputs.worker == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: worker/contact-form/package-lock.json

      - name: Install worker dependencies
        if: steps.changes.outputs.worker == 'true'
        run: npm ci

      - name: Validate Worker bundle
        if: steps.changes.outputs.worker == 'true'
        run: npx wrangler deploy --dry-run

      - name: Sync optional contact delivery secrets
        if: steps.changes.outputs.worker == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CONTACT_WEBHOOK_URL: ${{ secrets.CONTACT_WEBHOOK_URL }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: |
          if [ -n "$CONTACT_WEBHOOK_URL" ]; then
            printf '%s' "$CONTACT_WEBHOOK_URL" | npx wrangler secret put CONTACT_WEBHOOK_URL
          fi

          if [ -n "$RESEND_API_KEY" ]; then
            printf '%s' "$RESEND_API_KEY" | npx wrangler secret put RESEND_API_KEY
          fi

      - name: Deploy worker
        if: steps.changes.outputs.worker == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy

      - name: Verify existing live Worker when deployment is skipped
        if: steps.changes.outputs.worker != 'true'
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          endpoint='https://lecturer-materials.hicall.workers.dev/api/labs/ism/start'
          body="$(curl --fail-with-body --silent --show-error --max-time 30 "$endpoint")"
          printf '%s' "$body" | grep -q '"ok":true'
          printf '%s' "$body" | grep -q '"runtime":"cloudflare-worker"'
          echo "Worker source is unchanged and the existing production endpoint is healthy."
