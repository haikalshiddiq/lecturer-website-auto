name: Publish Weekly Indonesia Intelligence

on:
  schedule:
    # GitHub Actions uses UTC. Sunday 00:00 UTC is Sunday 07:00 WIB.
    - cron: '0 0 * * 0'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: weekly-indonesia-intelligence-main
  cancel-in-progress: false

jobs:
  publish-weekly-report:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/indonesia-intelligence-dashboard
    steps:
      - name: Checkout main
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: main

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/indonesia-intelligence-dashboard/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium for UI smoke tests
        run: npx playwright install --with-deps chromium

      - name: Generate source-linked weekly report
        run: npm run weekly:generate

      - name: Validate data and build
        run: npm run check

      - name: Detect report changes
        id: changes
        run: |
          if git diff --quiet -- public/data/weekly.json public/data/weekly/; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit weekly archive
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/weekly.json public/data/weekly/
          git commit -m "chore: publish weekly Indonesia intelligence"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Report unchanged week
        if: steps.changes.outputs.changed != 'true'
        run: echo "Weekly report already matches the generated period."
